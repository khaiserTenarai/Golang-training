<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Directory</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Employee Directory</h1>
  <p>This page is a static file. The table below is loaded from the JSON API.</p>

  <table id="employees">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Salary</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    fetch("/api/employee")
      .then(function (response) { return response.json(); })
      .then(function (employees) {
        var body = document.querySelector("#employees tbody");
        employees.forEach(function (e) {
          var row = document.createElement("tr");
          [e.id, e.name, e.email, e.department, e.salary].forEach(function (value) {
            var cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
      });
  </script>
</body>
</html>
